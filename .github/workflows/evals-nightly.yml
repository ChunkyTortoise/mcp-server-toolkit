name: Quality Evals (Nightly)
on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily
  workflow_dispatch:
    inputs:
      judge:
        description: "Enable LLM-as-judge scoring"
        type: boolean
        default: false
jobs:
  quality-evals:
    name: Quality Evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,auth]"
      - name: Run deterministic quality evals (pytest)
        run: pytest tests/test_evals/test_quality_evals.py -v --tb=short
      - name: Run quality eval runner (generates RESULTS.md)
        run: python evals/quality/runner.py --verbose --write-results
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Run with LLM-as-judge (if enabled)
        # secrets.* is not allowed in job `if:`; runner.py skips the judge when the key is absent
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.judge == 'true' }}
        run: python evals/quality/runner.py --judge --write-results
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-${{ github.run_number }}
          path: evals/RESULTS.md
          retention-days: 30
