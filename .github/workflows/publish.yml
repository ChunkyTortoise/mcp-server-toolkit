name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install hatch

      - name: Build
        run: hatch build

      # Trusted publishing (OIDC): PyPI must list this repo, publish.yml,
      # and the release environment as a trusted publisher. No token secret.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
