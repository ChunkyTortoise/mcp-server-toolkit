name: CI
on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check mcp_toolkit tests
      - name: Type check
        run: |
          pip install pyright
          pyright --pythonversion 3.10 mcp_toolkit
      - name: Test
        run: pytest tests/ -x -q --tb=short --cov=mcp_toolkit --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Evals
        run: python evals/run_evals.py
