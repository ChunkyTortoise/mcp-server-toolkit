name: CI
on:
  push:
    # "**" not "*": a single star does not match across "/", so branches like
    # fix/... or chore/... never triggered a push run. Feature branches only
    # ever got CI once a PR was opened.
    branches: ["**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check mcp_toolkit tests
      - name: Type check
        run: |
          pip install pyright
          pyright --pythonversion 3.10 mcp_toolkit
      - name: Test
        run: pytest tests/ -x -q --tb=short --cov=mcp_toolkit --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Evals
        run: python evals/run_evals.py

  package:
    name: Wheel installs and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
      - name: Import from the installed wheel
        run: /tmp/wheel-env/bin/python -c "from mcp_toolkit import EnhancedMCP; print('wheel import ok')"
