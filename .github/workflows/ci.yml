name: CI
on:
  push:
    # "**" not "*": a single star does not match across "/", so branches like
    # fix/... or chore/... never triggered a push run. Feature branches only
    # ever got CI once a PR was opened.
    branches: ["**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check mcp_toolkit tests
      - name: Type check
        run: |
          pip install pyright
          pyright --pythonversion 3.10 mcp_toolkit
      - name: Test
        run: pytest tests/ -x -q --tb=short --cov=mcp_toolkit --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Evals
        run: python evals/run_evals.py
      - name: Claims ledger
        # Every public number needs an artifact and a reproduction command.
        # --published executes the command of each claim a scanned doc prints.
        # --strict (stale/retracted/illustrative numbers fail) is for release and deploy.
        run: python scripts/check_claims.py --check --run --published

  package:
    name: Wheel installs and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
      # Steps run from /tmp so the checkout cannot shadow the installed package.
      - name: Import from the installed wheel
        working-directory: /tmp
        run: /tmp/wheel-env/bin/python -c "from mcp_toolkit import EnhancedMCP; print('wheel import ok')"
      - name: Run the gateway entry point from the installed wheel
        working-directory: /tmp
        run: |
          /tmp/wheel-env/bin/python -c "from mcp_toolkit.gateway import create_server, sdk_bridge; print('gateway import ok')"
          /tmp/wheel-env/bin/mcp-toolkit-gateway --help
          MCP_JWT_SECRET=ci /tmp/wheel-env/bin/python -m mcp_toolkit.gateway --print-demo-token orders:read | grep -q '\.'
          # Boot the installed gateway and confirm the transport refuses an unauthenticated call.
          MCP_JWT_SECRET=ci /tmp/wheel-env/bin/mcp-toolkit-gateway & pid=$!
          for _ in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8000/mcp && break; sleep 0.2; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp)
          kill $pid
          test "$code" = 401

  integration:
    name: Postgres read-only role
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser-throwaway
          POSTGRES_DB: mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci-superuser-throwaway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Create seeded tables and the read-only role
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d mcp_test -f tests/test_database_query/integration_setup.sql
      - name: Integration tests (fail on any skip)
        env:
          INTEGRATION: "1"
          DATABASE_URL: postgresql://mcp_reader:ci-throwaway-password@localhost:5432/mcp_test
          ADMIN_DATABASE_URL: postgresql://postgres:ci-superuser-throwaway@localhost:5432/mcp_test
        run: |
          set -o pipefail
          pytest tests/test_database_query/test_postgres_client.py -v -s -rs | tee out.txt
          ! grep -q SKIPPED out.txt
