[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-toolkit"
version = "0.3.0.dev0"
description = "MCP server framework with caching, rate limiting, OpenTelemetry, and 9 pre-built servers for database, web scraping, file processing, analytics, email, calendar, CRM/GHL, Gemini embedding, and multi-LLM routing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Cayman Roden" }]
keywords = ["mcp", "model-context-protocol", "ai", "llm", "anthropic", "claude", "tools", "agents", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.23.0",
    "pydantic>=2.10",
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/ChunkyTortoise/mcp-server-toolkit"
Repository = "https://github.com/ChunkyTortoise/mcp-server-toolkit"
Documentation = "https://github.com/ChunkyTortoise/mcp-server-toolkit#readme"

[project.scripts]
mcp-toolkit-db = "mcp_toolkit.servers.database_query.server:main"
mcp-toolkit-web = "mcp_toolkit.servers.web_scraping.server:main"
mcp-toolkit-files = "mcp_toolkit.servers.file_processing.server:main"
mcp-toolkit-analytics = "mcp_toolkit.servers.analytics.server:main"
mcp-toolkit-email = "mcp_toolkit.servers.email.server:main"
mcp-toolkit-calendar = "mcp_toolkit.servers.calendar.server:main"
mcp-toolkit-crm-ghl = "mcp_toolkit.servers.crm_ghl.server:main"
mcp-toolkit-embedding = "mcp_toolkit.servers.gemini_embedding.server:main"
mcp-toolkit-multi-llm = "mcp_toolkit.servers.multi_llm.server:main"

[project.optional-dependencies]
database = ["sqlglot>=26", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30"]
web = ["beautifulsoup4>=4.12", "lxml>=5.0"]
files = ["PyPDF2>=3.0", "openpyxl>=3.1", "python-magic>=0.4"]
redis = ["redis>=5.2"]
auth = ["PyJWT[crypto]>=2.8"]
telemetry = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
gmail = [
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
]
gcal = [
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
]
all = [
    "mcp-server-toolkit[database]",
    "mcp-server-toolkit[web]",
    "mcp-server-toolkit[files]",
    "mcp-server-toolkit[redis]",
    "mcp-server-toolkit[auth]",
    "mcp-server-toolkit[telemetry]",
]
dev = [
    "mcp-server-toolkit[all]",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E", "F401", "F841"]

[tool.hatch.build.targets.wheel]
packages = ["mcp_toolkit"]
