[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-toolkit"
version = "0.3.0"
description = "Opt-in MCP tool decorators for FastMCP: JWT/JWKS auth, read-only SQL allowlist, TTL caching, rate limits, OpenTelemetry spans, plus 9 example servers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Cayman Roden" }]
keywords = ["mcp", "model-context-protocol", "ai", "llm", "claude", "tools", "agents", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "pydantic>=2.10",
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/ChunkyTortoise/mcp-server-toolkit"
Repository = "https://github.com/ChunkyTortoise/mcp-server-toolkit"
Documentation = "https://github.com/ChunkyTortoise/mcp-server-toolkit#readme"

[project.scripts]
mcp-toolkit-db = "mcp_toolkit.servers.database_query.server:main"
mcp-toolkit-web = "mcp_toolkit.servers.web_scraping.server:main"
mcp-toolkit-files = "mcp_toolkit.servers.file_processing.server:main"
mcp-toolkit-analytics = "mcp_toolkit.servers.analytics.server:main"
mcp-toolkit-email = "mcp_toolkit.servers.email.server:main"
mcp-toolkit-calendar = "mcp_toolkit.servers.calendar.server:main"
mcp-toolkit-crm-ghl = "mcp_toolkit.servers.crm_ghl.server:main"
mcp-toolkit-embedding = "mcp_toolkit.servers.gemini_embedding.server:main"
mcp-toolkit-multi-llm = "mcp_toolkit.servers.multi_llm.server:main"
mcp-toolkit-gateway = "mcp_toolkit.gateway.app:main"

[project.optional-dependencies]
database = ["sqlglot>=26", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30"]
web = ["beautifulsoup4>=4.12", "lxml>=5.0"]
files = ["pypdf>=6.19.0", "openpyxl>=3.1"]
redis = ["redis>=5.2"]
auth = ["PyJWT[cryptography]>=2.13.0"]
console = ["jinja2>=3.1"]
telemetry = [
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
gmail = [
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.4.1",
]
gcal = [
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.4.1",
]
all = [
    "mcp-server-toolkit[database]",
    "mcp-server-toolkit[web]",
    "mcp-server-toolkit[files]",
    "mcp-server-toolkit[redis]",
    "mcp-server-toolkit[auth]",
    "mcp-server-toolkit[telemetry]",
]
dev = [
    "mcp-server-toolkit[all]",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9,<0.17",
    # scripts/check_claims.py parses docs/claims.yaml; nothing in the current
    # dependency set reads YAML, and a hand-rolled parser would break on
    # legitimate ledger entries. Dev-only: the runtime package does not need it.
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pinned explicitly: ruff 0.16 expanded its implicit defaults, which turned a
# green gate red without a code change. Selection must not float with the tool.
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E", "F401", "F841"]

[tool.hatch.build.targets.wheel]
packages = ["mcp_toolkit"]
