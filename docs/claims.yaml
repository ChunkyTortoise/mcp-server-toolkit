baseline: "origin/main @ cb932cf (PR #66 merged)"
# Claims ledger: the single source of truth for every public number.
#
# Rule: a number may appear in a public document only if it has an entry here
# with an artifact and a reproduction command. `scripts/check_claims.py` is the
# enforcement. `--check` gates; `--sample N` executes N commands; `--strict`
# fails on anything stale, retracted or illustrative.
#
# Statuses:
#   verified      re-ran in this tree and the artifact is current
#   historical    a dated measurement kept at its original method; not re-run today
#   ci_gate       configuration value (a floor or a limit), not a measurement
#   inventory     a count of files in the tree, dated
#   illustrative  arithmetic or an assumption presented as such, not a measurement
#   stale         registered, does not reproduce; must be re-measured or deleted
#   retracted     no artifact can support it; must be deleted before the next deploy
#
# Field notes:
#   match            exact tokens as the scanner produces them ("818 passed", "3.1x")
#   artifact_check   exists (default) or contains (value must appear in the file)
#   executes         false when running the command has a side effect or is not
#                    the kind of thing that reproduces the number
#   network          true for claims whose command needs outbound traffic
#
# `python`, `ruff` and `pyright` in commands resolve through the interpreter
# that runs the checker, so the same ledger works in a venv, in CI and in a
# bare checkout.
docs_scanned:
  - README.md
  - docs/CASE_STUDY.md
  - docs/VERIFIED_DEMO.md
  - examples/README.md
  - evals/RESULTS.md
  - benchmarks/RESULTS.md
allow:
  # Token-scoped, and narrowed to one file where the same number is a claim
  # elsewhere. Kept deliberately short: everything else must be a real claim.
  - token: "^[23]$"
    where: "evals/RESULTS.md"
    reason: >-
      Per-category case counts in the eval coverage table. The suite total is registered by `recovery-quality-evals` and re-derived by its command.
